# ============================================================
# SHMÚ → APRS Meteorologické výstrahy
# Skopíruj na config.yaml a uprav podľa seba
# ============================================================

aprs:
  callsign: "OM0XXX-13"
  passcode: 12345
  server: "euro.aprs2.net"
  port: 14580
  software: "SHMU"

filter:
  regions:
    - "KSK"
    - "PSK"
  districts:
    - "Košice"
    - "Košice mesto"
    - "Košice okolie"
    - "Prešov"
    - "Poprad"
    - "Spišská Nová Ves"
    - "Michalovce"
    - "Humenné"
    - "Bardejov"
  min_level: 1

beacon:
  interval_minutes: 30
  lead_hours: 12                 # hodiny pred začiatkom platnosti už vysielať na APRS
  poll_interval_seconds: 300
  object_lifetime_hours: 6

sources:
  cap_base_url: "https://opendata.shmu.sk/meteorology/weather/alerts/cap/"
  html_url: "https://www.shmu.sk/sk/?page=987"
  use_html_fallback: true

logging:
  level: "INFO"
  file: "/var/log/shmu-aprs-alerts.log"
  max_bytes: 1048576
  backup_count: 3

watchdog:
  enabled: true
  interval_seconds: 60
