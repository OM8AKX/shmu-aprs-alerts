# ============================================================
# SHMÚ → APRS Meteorologické výstrahy + hydro SPA + blesky
# Skopíruj na config.yaml a uprav podľa seba
# ============================================================

aprs:
  callsign: "OM0XXX-13"
  passcode: 12345
  server: "euro.aprs2.net"
  port: 14580
  software: "SHMU"

filter:
  regions:
    - "KSK"
    - "PSK"
    - "ZSK"
    - "BBSK"
  districts:
    - "Košice mesto"
    - "Košice okolie"
    - "Gelnica"
    - "Michalovce"
    - "Rožňava"
    - "Sobrance"
    - "Spišská Nová Ves"
    - "Trebišov"
    - "Prešov"
    - "Bardejov"
    - "Humenné"
    - "Kežmarok"
    - "Levoča"
    - "Medzilaborce"
    - "Poprad"
    - "Sabinov"
    - "Snina"
    - "Stará Ľubovňa"
    - "Stropkov"
    - "Svidník"
    - "Vranov nad Topľou"
    - "Žilina"
    - "Bytča"
    - "Čadca"
    - "Dolný Kubín"
    - "Kysucké Nové Mesto"
    - "Liptovský Mikuláš"
    - "Martin"
    - "Námestovo"
    - "Ružomberok"
    - "Turčianske Teplice"
    - "Tvrdošín"
    - "Banská Bystrica"
    - "Banská Štiavnica"
    - "Brezno"
    - "Detva"
    - "Krupina"
    - "Lučenec"
    - "Poltár"
    - "Revúca"
    - "Rimavská Sobota"
    - "Veľký Krtíš"
    - "Zvolen"
    - "Žarnovica"
    - "Žiar nad Hronom"
  min_level: 1

hydro:
  enabled: true
  min_spa: 1
  url: "https://www.shmu.sk/sk/?page=765"
  stations: []

# Aktivita bleskov (Blitzortung) – SK + ~30 km za hranicami
# Agregácia do mriežky (nie každý úder) kvôli limitu APRS-IS
# Dáta len pre súkromné/hobby použitie podľa podmienok Blitzortung.org
lightning:
  enabled: true
  window_minutes: 15       # údery za posledných N minút
  grid_deg: 0.20           # ~22 km bunky
  min_strikes: 2           # minimálny počet v bunke
  max_objects: 15          # max ikon na mape naraz
  # bbox SK + 30 km (predvolené hodnoty v lightning.py)
  # south: 47.48
  # west: 16.50
  # north: 49.92
  # east: 22.90

beacon:
  interval_minutes: 30
  lead_hours: 0
  poll_interval_seconds: 300
  object_lifetime_hours: 6

sources:
  cap_base_url: "https://opendata.shmu.sk/meteorology/weather/alerts/cap/"
  html_url: "https://www.shmu.sk/sk/?page=987"
  use_html_fallback: true

logging:
  level: "INFO"
  file: "/var/log/shmu-aprs-alerts.log"
  max_bytes: 1048576
  backup_count: 3

watchdog:
  enabled: true
  interval_seconds: 60
