# ============================================================
# SHMÚ → APRS Meteorologické výstrahy + hydro SPA
# Skopíruj na config.yaml a uprav podľa seba
# ============================================================

aprs:
  callsign: "OM0XXX-13"
  passcode: 12345
  server: "euro.aprs2.net"
  port: 14580
  software: "SHMU"

filter:
  regions:
    - "KSK"
    - "PSK"
    - "ZSK"
    - "BBSK"
  districts:
    # Košický kraj (KSK)
    - "Košice mesto"
    - "Košice okolie"
    - "Gelnica"
    - "Michalovce"
    - "Rožňava"
    - "Sobrance"
    - "Spišská Nová Ves"
    - "Trebišov"
    # Prešovský kraj (PSK)
    - "Prešov"
    - "Bardejov"
    - "Humenné"
    - "Kežmarok"
    - "Levoča"
    - "Medzilaborce"
    - "Poprad"
    - "Sabinov"
    - "Snina"
    - "Stará Ľubovňa"
    - "Stropkov"
    - "Svidník"
    - "Vranov nad Topľou"
    # Žilinský kraj (ZSK)
    - "Žilina"
    - "Bytča"
    - "Čadca"
    - "Dolný Kubín"
    - "Kysucké Nové Mesto"
    - "Liptovský Mikuláš"
    - "Martin"
    - "Námestovo"
    - "Ružomberok"
    - "Turčianske Teplice"
    - "Tvrdošín"
    # Banskobystrický kraj (BBSK)
    - "Banská Bystrica"
    - "Banská Štiavnica"
    - "Brezno"
    - "Detva"
    - "Krupina"
    - "Lučenec"
    - "Poltár"
    - "Revúca"
    - "Rimavská Sobota"
    - "Veľký Krtíš"
    - "Zvolen"
    - "Žarnovica"
    - "Žiar nad Hronom"
  min_level: 1

# Povodňová aktivita (vodomerné stanice SHMÚ)
hydro:
  enabled: true
  min_spa: 1                 # vysielať od 1. stupňa SPA (1–3)
  url: "https://www.shmu.sk/sk/?page=765"
  # prázdne = všetky preddefinované stanice v hydro.py
  stations: []
  lifetime_hours: 2

beacon:
  interval_minutes: 30
  lead_hours: 0                  # 0 = vysielať až od začiatku platnosti (effective)
  poll_interval_seconds: 300
  object_lifetime_hours: 6

sources:
  cap_base_url: "https://opendata.shmu.sk/meteorology/weather/alerts/cap/"
  html_url: "https://www.shmu.sk/sk/?page=987"
  use_html_fallback: true

logging:
  level: "INFO"
  file: "/var/log/shmu-aprs-alerts.log"
  max_bytes: 1048576
  backup_count: 3

watchdog:
  enabled: true
  interval_seconds: 60
