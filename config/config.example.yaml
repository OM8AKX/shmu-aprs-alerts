# ============================================================
# SHMÚ → APRS Meteorologické výstrahy
# Skopíruj na config.yaml a uprav podľa seba
# ============================================================

# Pre Docker: log path môže zostať /var/log/shmu-aprs-alerts.log
# (mapované volume v docker-compose.yml)

aprs:
  callsign: "OM0XXX-13"          # Tvoj callsign + SSID (odporúčané -13 pre WX/alerts)
  passcode: 12345                # https://apps.magicbug.co.uk/passcode/
  server: "euro.aprs2.net"       # alebo rotate.aprs2.net / slovakia.aprs2.net
  port: 14580
  software: "SHMU"

filter:
  regions:
    - "KSK"
    - "PSK"
  districts:
    - "Košice"
    - "Prešov"
    - "Poprad"
    - "Spišská Nová Ves"
    - "Michalovce"
    - "Humenné"
    - "Bardejov"
  min_level: 1

beacon:
  interval_minutes: 30          # opakované vysielanie každých X minút
  lead_hours: 12                 # hodiny pred začiatkom platnosti už vysielať na APRS
  poll_interval_seconds: 300    # ako často kontrolovať nové výstrahy zo SHMÚ
  object_lifetime_hours: 6      # max. doba života objektu (po expirácii sa pošle kill)

sources:
  cap_base_url: "https://opendata.shmu.sk/meteorology/weather/alerts/cap/"
  html_url: "https://www.shmu.sk/sk/?page=1&id=meteo_vystraha"
  use_html_fallback: true

logging:
  level: "INFO"
  file: "/var/log/shmu-aprs-alerts.log"
  max_bytes: 1048576
  backup_count: 3

watchdog:
  enabled: true
  interval_seconds: 60
